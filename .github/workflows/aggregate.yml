name: aggregate

on:
  schedule:
    # 每小时的第 17 分跑一次（UTC，等于北京时间每小时的 :17）
    - cron: "17 * * * *"
  issues:
    types: [opened, edited, reopened, labeled, unlabeled, closed]
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: aggregate
  cancel-in-progress: true

jobs:
  aggregate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 聚合帖子 → index.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/aggregate.py

      - name: 提交结果
        run: |
          git config user.name "kb-bot"
          git config user.email "kb-bot@users.noreply.github.com"
          git add index.json items || true
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "kb: aggregate $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
